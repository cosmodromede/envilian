<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envilian Dictionary</title>
    <style>
        :root {
           :root {
    --bg-color: #f7f5f0;
    --sidebar-color: #c71585;      /* Dark hot pink */
    --sidebar-border: #900f60;     /* Deeper pink border */
    --card-bg: #ffffff;
    --card-border: #d0cbc2;
    --text-main: #2c3e50;
    --text-muted: #6c757d;
    --accent-hover: rgba(255, 255, 255, 0.2);
    --active-bg: #ffffff;
    --active-text: #c71585;
    --active-border: #900f60;
}

body {
    font-family: 'Savigny', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Banner Styling */
        header.banner {
            height: 140px;
            width: 100%;
            background-color: #1b3d45;
            background-image: url('banner.png');
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            border-bottom: 3px solid var(--sidebar-border);
        }

        /* Workspace Layout */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Styling */
        nav.sidebar {
            width: 76px;
            background-color: var(--sidebar-color);
            border-right: 3px solid var(--sidebar-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }

        .home-button {
            height: 70px;
            width: 100%;
            background-image: url('flag.png');
            background-size: cover;
            background-position: center;
            cursor: pointer;
            border-bottom: 3px solid var(--sidebar-border);
            transition: opacity 0.2s ease;
        }

        .home-button:hover {
            opacity: 0.85;
        }

        .alphabet-list {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 10px;
            scrollbar-width: none;
        }

        .alphabet-list::-webkit-scrollbar {
            display: none;
        }

        .letter-btn {
            width: 48px;
            height: 48px;
            border-radius: 0;
            border: 2px solid transparent;
            background: transparent;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .letter-btn:hover {
            background-color: var(--accent-hover);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .letter-btn.active {
            background-color: var(--active-bg);
            color: var(--active-text);
            border: 2px solid var(--active-border);
            font-weight: 700;
        }

        /* Main Content Area */
        main.content-area {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-container {
            width: 100%;
            max-width: 850px;
        }

        /* Section Header for Letter Views */
        .section-header {
            font-size: 2rem;
            font-weight: 700;
            color: var(--sidebar-color);
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 3px solid var(--sidebar-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Welcome Screen */
        .welcome-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 0;
            padding: 48px;
            text-align: center;
        }

        .welcome-logo {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border: 2px solid var(--card-border);
            margin: 0 auto 20px auto;
            display: block;
        }

        .welcome-card h1 {
            font-size: 2.2rem;
            color: var(--sidebar-color);
            margin-bottom: 16px;
        }

        .welcome-card p {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .welcome-card hr {
            border: none;
            height: 2px;
            background: var(--card-border);
            margin: 24px 0;
        }

        .stats-badge {
            display: inline-block;
            background: rgba(35, 77, 88, 0.08);
            border: 2px solid var(--sidebar-color);
            color: var(--sidebar-color);
            padding: 8px 16px;
            border-radius: 0;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Table Card Container */
        .table-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 0;
            padding: 24px;
        }

        /* Table Styling (Hard-edged & Blocky) */
        .word-table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid var(--card-border);
        }

        .word-table th, .word-table td {
            border: 1px solid var(--card-border);
            padding: 12px 16px;
            text-align: left;
            font-size: 1rem;
            color: var(--text-main);
        }

        .word-table th {
            background-color: rgba(35, 77, 88, 0.08);
            color: var(--sidebar-color);
            font-weight: 700;
        }

        .word-table tr:nth-child(even) {
            background-color: #fbf9f5;
        }

        /* States (Loading / Error / Empty) */
        .state-message {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.1rem;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 0;
        }
    </style>
</head>
<body>

    <header class="banner" role="banner" aria-label="Envilian Banner"></header>

    <div class="workspace">
        <nav class="sidebar" aria-label="Alphabet Navigation">
            <div class="home-button" id="homeBtn" title="Home Screen" role="button" tabindex="0"></div>
            <div class="alphabet-list" id="alphabetList"></div>
        </nav>

        <main class="content-area">
            <div class="content-container" id="contentContainer">
                <!-- Dynamically populated via JS -->
            </div>
        </main>
    </div>

    <script>
        // Alphabet list remains capital for display, but lowercase filenames are used for fetch
        const alphabet = ['a', 'ä', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'x', 'ẍ', 'y', 'z'];

        const homeBtn = document.getElementById('homeBtn');
        const alphabetList = document.getElementById('alphabetList');
        const contentContainer = document.getElementById('contentContainer');

        let activeLetterButton = null;

        // Render Sidebar Alphabet Buttons
        function initAlphabetSidebar() {
            alphabet.forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.textContent = letter;
                btn.addEventListener('click', () => selectLetter(letter, btn));
                alphabetList.appendChild(btn);
            });
        }

        // Render Welcome / Home Screen
        function renderWelcomeScreen() {
            contentContainer.innerHTML = '';
            
            const card = document.createElement('div');
            card.className = 'welcome-card';

            const logo = document.createElement('img');
            logo.className = 'welcome-logo';
            logo.src = 'flag.png';
            logo.alt = 'Envilian Logo';
            card.appendChild(logo);

            const title = document.createElement('h1');
            title.textContent = 'Envilian Dictionary';
            card.appendChild(title);

            const desc = document.createElement('p');
            desc.textContent = 'Welcome to the Official Constructed Language Index. Explore the lexicon of Envilian by selecting any letter from the navigation sidebar on your left.';
            card.appendChild(desc);

            const hr = document.createElement('hr');
            card.appendChild(hr);

            const badge = document.createElement('div');
            badge.className = 'stats-badge';
            badge.textContent = `Alphabet: ${alphabet.length} custom characters loaded`;
            card.appendChild(badge);

            contentContainer.appendChild(card);
        }

        // Fetch and Display Letter Entries (Using lowercase filenames like a.txt, ä.txt, etc.)
        async function selectLetter(letter, btnElement) {
            if (activeLetterButton) {
                activeLetterButton.classList.remove('active');
            }
            activeLetterButton = btnElement;
            activeLetterButton.classList.add('active');

            contentContainer.innerHTML = '';
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'state-message';
            loadingMsg.textContent = `Loading entries for "${letter}"...`;
            contentContainer.appendChild(loadingMsg);

            // Convert letter to lowercase for fetching lowercase text files (e.g., a.txt, ä.txt)
            const fileName = letter.toLowerCase();

            try {
                const response = await fetch(`${fileName}.txt`);
                if (!response.ok) {
                    throw new Error(`Could not load entries (Status: ${response.status})`);
                }
                const textData = await response.text();
                renderEntries(letter, textData);
            } catch (error) {
                contentContainer.innerHTML = '';
                const errorMsg = document.createElement('div');
                errorMsg.className = 'state-message';
                errorMsg.style.borderColor = '#9b2c2c';
                errorMsg.style.color = '#c53030';
                errorMsg.textContent = `No dictionary file found for letter "${letter}" or failed to load. (Ensure "${fileName}.txt" is uploaded in the main directory).`;
                contentContainer.appendChild(errorMsg);
            }
        }

        // Parse File Content and Render Pure Table View
        function renderEntries(letter, fileContent) {
            contentContainer.innerHTML = '';

            // 1. Title Header ("WORDS - A")
            const sectionTitle = document.createElement('h2');
            sectionTitle.className = 'section-header';
            sectionTitle.textContent = `Words - ${letter}`;
            contentContainer.appendChild(sectionTitle);

            const lines = fileContent.split('\n').map(l => l.trim()).filter(l => l.length > 0);

            if (lines.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'state-message';
                emptyMsg.textContent = `No entries listed under letter "${letter}" yet.`;
                contentContainer.appendChild(emptyMsg);
                return;
            }

            // 2. Wrap Table Inside Card Container
            const tableCard = document.createElement('div');
            tableCard.className = 'table-card';

            const table = document.createElement('table');
            table.className = 'word-table';

            lines.forEach(line => {
                const tr = document.createElement('tr');
                const cells = line.split(' - ').map(c => c.trim());

                cells.forEach(cellText => {
                    const cell = document.createElement('td');
                    cell.textContent = cellText;
                    tr.appendChild(cell);
                });

                table.appendChild(tr);
            });

            tableCard.appendChild(table);
            contentContainer.appendChild(tableCard);
        }

        // Home Button Event Listener
        homeBtn.addEventListener('click', () => {
            if (activeLetterButton) {
                activeLetterButton.classList.remove('active');
                activeLetterButton = null;
            }
            renderWelcomeScreen();
        });

        // Initialize App on Load
        initAlphabetSidebar();
        renderWelcomeScreen();
    </script>
</body>
</html>
