<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envilian Dictionary</title>
    <style>
        :root {
            --bg-color: #f7f5f0;
            --sidebar-color: #234d58;
            --sidebar-border: #16323a;
            --card-bg: #ffffff;
            --card-border: #d0cbc2;
            --text-main: #2c3e50;
            --text-muted: #6c757d;
            --accent-hover: rgba(255, 255, 255, 0.15);
            --active-bg: #ffffff;
            --active-text: #234d58;
            --active-border: #16323a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Banner Styling */
        header.banner {
            height: 140px;
            width: 100%;
            background-color: #1b3d45;
            background-image: url('banner.png');
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            border-bottom: 3px solid var(--sidebar-border);
        }

        /* Workspace Layout */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Styling */
        nav.sidebar {
            width: 76px;
            background-color: var(--sidebar-color);
            border-right: 3px solid var(--sidebar-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
            z-index: 10;
        }

        .home-button {
            height: 70px;
            width: 100%;
            background-image: url('flag.png');
            background-size: cover;
            background-position: center;
            cursor: pointer;
            border-bottom: 3px solid var(--sidebar-border);
            transition: opacity 0.2s ease;
        }

        .home-button:hover {
            opacity: 0.85;
        }

        .alphabet-list {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 10px;
            scrollbar-width: none;
        }

        .alphabet-list::-webkit-scrollbar {
            display: none;
        }

        .letter-btn {
            width: 48px;
            height: 48px;
            border-radius: 0;
            border: 2px solid transparent;
            background: transparent;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .letter-btn:hover {
            background-color: var(--accent-hover);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .letter-btn.active {
            background-color: var(--active-bg);
            color: var(--active-text);
            border: 2px solid var(--active-border);
            font-weight: 700;
        }

        /* Main Content Area */
        main.content-area {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .content-container {
            width: 100%;
            max-width: 850px;
        }

        /* Section Header for Letter Views */
        .section-header {
            font-size: 2rem;
            font-weight: 700;
            color: var(--sidebar-color);
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 3px solid var(--sidebar-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Welcome Screen */
        .welcome-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 0;
            padding: 48px;
            text-align: center;
        }

        .welcome-logo {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border: 2px solid var(--card-border);
            margin: 0 auto 20px auto;
            display: block;
        }

        .welcome-card h1 {
            font-size: 2.2rem;
            color: var(--sidebar-color);
            margin-bottom: 16px;
        }

        .welcome-card p {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .welcome-card hr {
            border: none;
            height: 2px;
            background: var(--card-border);
            margin: 24px 0;
        }

        .stats-badge {
            display: inline-block;
            background: rgba(35, 77, 88, 0.08);
            border: 2px solid var(--sidebar-color);
            color: var(--sidebar-color);
            padding: 8px 16px;
            border-radius: 0;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Word Entry Cards */
        .word-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .word-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 0;
            padding: 30px;
        }

        .word-header {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--card-border);
            padding-bottom: 14px;
        }

        .word-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--sidebar-color);
        }

        .word-pos {
            font-size: 0.95rem;
            font-weight: 600;
            color: #b45309;
            background: #fffbeb;
            border: 2px solid #fcd34d;
            padding: 3px 8px;
            border-radius: 0;
            text-transform: lowercase;
        }

        .word-definition {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-main);
        }

        /* Table Styling (Hard-edged & Blocky) */
        .word-table {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0;
            border: 2px solid var(--card-border);
        }

        .word-table th, .word-table td {
            border: 1px solid var(--card-border);
            padding: 10px 14px;
            text-align: left;
            font-size: 0.95rem;
        }

        .word-table th {
            background-color: rgba(35, 77, 88, 0.08);
            color: var(--sidebar-color);
            font-weight: 700;
        }

        .word-table tr:nth-child(even) {
            background-color: #fbf9f5;
        }

        /* Markdown Styles inside Definitions */
        .word-definition h3 {
            font-size: 1.2rem;
            color: var(--sidebar-color);
            margin: 16px 0 8px 0;
        }

        .word-definition blockquote {
            border-left: 4px solid var(--sidebar-color);
            border-top: 1px solid var(--card-border);
            border-right: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
            padding: 10px 16px;
            margin: 12px 0;
            color: var(--text-muted);
            font-style: italic;
            background: #f4f1eb;
            border-radius: 0;
        }

        .word-definition p {
            margin-bottom: 10px;
        }

        .word-definition p:last-child {
            margin-bottom: 0;
        }

        /* States (Loading / Error / Empty) */
        .state-message {
            text-align: center;
            padding: 60px 20px;
            font-size: 1.1rem;
            color: var(--text-muted);
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 0;
        }
    </style>
</head>
<body>

    <header class="banner" role="banner" aria-label="Envilian Banner"></header>

    <div class="workspace">
        <nav class="sidebar" aria-label="Alphabet Navigation">
            <div class="home-button" id="homeBtn" title="Home Screen" role="button" tabindex="0"></div>
            <div class="alphabet-list" id="alphabetList"></div>
        </nav>

        <main class="content-area">
            <div class="content-container" id="contentContainer">
                </div>
        </main>
    </div>

    <script>
        const alphabet = ['a', 'ä', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'x', 'ẍ', 'y', 'z'];

        const homeBtn = document.getElementById('homeBtn');
        const alphabetList = document.getElementById('alphabetList');
        const contentContainer = document.getElementById('contentContainer');

        let activeLetterButton = null;

        // Render Sidebar Alphabet Buttons
        function initAlphabetSidebar() {
            alphabet.forEach(letter => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.textContent = letter;
                btn.addEventListener('click', () => selectLetter(letter, btn));
                alphabetList.appendChild(btn);
            });
        }

        // Advanced Parser Engine (Handles Markdown & Hyphenated Table Rows)
        function parseMarkdown(rawText) {
            const lines = rawText.split('\n');
            const container = document.createElement('div');
            container.className = 'word-definition';

            let currentParagraph = null;
            let currentTableRows = [];

            function flushParagraph() {
                if (currentParagraph) {
                    container.appendChild(currentParagraph);
                    currentParagraph = null;
                }
            }

            function flushTable() {
                if (currentTableRows.length > 0) {
                    const table = document.createElement('table');
                    table.className = 'word-table';

                    currentTableRows.forEach((rowCells, index) => {
                        const tr = document.createElement('tr');
                        rowCells.forEach(cellText => {
                            const cell = document.createElement(index === 0 && (cellText.toLowerCase().includes('english') || cellText.toLowerCase().includes('translation')) ? 'th' : 'td');
                            cell.innerHTML = formatInlineMarkdown(cellText);
                            tr.appendChild(cell);
                        });
                        table.appendChild(tr);
                    });

                    container.appendChild(table);
                    currentTableRows = [];
                }
            }

            lines.forEach(line => {
                const trimmed = line.trim();

                if (trimmed.startsWith('### ')) {
                    flushParagraph();
                    flushTable();
                    const h3 = document.createElement('h3');
                    h3.innerHTML = formatInlineMarkdown(trimmed.replace('### ', ''));
                    container.appendChild(h3);
                } else if (trimmed.startsWith('> ')) {
                    flushParagraph();
                    flushTable();
                    const blockquote = document.createElement('blockquote');
                    blockquote.innerHTML = formatInlineMarkdown(trimmed.replace('> ', ''));
                    container.appendChild(blockquote);
                } else if (trimmed.includes(' - ') && !trimmed.startsWith('>') && trimmed !== '') {
                    flushParagraph();
                    const cells = trimmed.split(' - ').map(c => c.trim());
                    currentTableRows.push(cells);
                } else if (trimmed === '') {
                    flushParagraph();
                    flushTable();
                } else {
                    flushTable();
                    if (!currentParagraph) {
                        currentParagraph = document.createElement('p');
                        currentParagraph.innerHTML = formatInlineMarkdown(trimmed);
                    } else {
                        currentParagraph.innerHTML += ' ' + formatInlineMarkdown(trimmed);
                    }
                }
            });

            flushParagraph();
            flushTable();
            return container;
        }

        // Inline Markdown Helper (**bold**, *italic*)
        function formatInlineMarkdown(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>');
        }

        // Render Welcome / Home Screen
        function renderWelcomeScreen() {
            contentContainer.innerHTML = '';
            
            const card = document.createElement('div');
            card.className = 'welcome-card';

            const logo = document.createElement('img');
            logo.className = 'welcome-logo';
            logo.src = 'flag.png';
            logo.alt = 'Envilian Logo';
            card.appendChild(logo);

            const title = document.createElement('h1');
            title.textContent = 'Envilian Dictionary';
            card.appendChild(title);

            const desc = document.createElement('p');
            desc.textContent = 'Welcome to the Official Constructed Language Index. Explore the lexicon of Envilian by selecting any letter from the navigation sidebar on your left.';
            card.appendChild(desc);

            const hr = document.createElement('hr');
            card.appendChild(hr);

            const badge = document.createElement('div');
            badge.className = 'stats-badge';
            badge.textContent = `Alphabet: ${alphabet.length} custom characters loaded`;
            card.appendChild(badge);

            contentContainer.appendChild(card);
        }

        // Fetch and Display Letter Entries
        async function selectLetter(letter, btnElement) {
            if (activeLetterButton) {
                activeLetterButton.classList.remove('active');
            }
            activeLetterButton = btnElement;
            activeLetterButton.classList.add('active');

            contentContainer.innerHTML = '';
            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'state-message';
            loadingMsg.textContent = `Loading entries for "${letter}"...`;
            contentContainer.appendChild(loadingMsg);

            try {
                const response = await fetch(`${letter}.txt`);
                if (!response.ok) {
                    throw new Error(`Could not load entries (Status: ${response.status})`);
                }
                const textData = await response.text();
                renderEntries(letter, textData);
            } catch (error) {
                contentContainer.innerHTML = '';
                const errorMsg = document.createElement('div');
                errorMsg.className = 'state-message';
                errorMsg.style.borderColor = '#9b2c2c';
                errorMsg.style.color = '#c53030';
                errorMsg.textContent = `No dictionary file found for letter "${letter}" or failed to load. (Ensure "${letter}.txt" is uploaded in the main directory).`;
                contentContainer.appendChild(errorMsg);
            }
        }

        // Parse File Content and Render Word Cards
        function renderEntries(letter, fileContent) {
            contentContainer.innerHTML = '';

            // Add the "Words - [letter]" title header
            const sectionTitle = document.createElement('h2');
            sectionTitle.className = 'section-header';
            sectionTitle.textContent = `Words - ${letter}`;
            contentContainer.appendChild(sectionTitle);

            const rawEntries = fileContent.split(/\n\s*---\s*\n/);
            const validEntries = rawEntries.map(e => e.trim()).filter(e => e.length > 0);

            if (validEntries.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'state-message';
                emptyMsg.textContent = `No entries listed under letter "${letter}" yet.`;
                contentContainer.appendChild(emptyMsg);
                return;
            }

            const listWrapper = document.createElement('div');
            listWrapper.className = 'word-list';

            validEntries.forEach(entryText => {
                const lines = entryText.split('\n');
                const headerLine = lines[0] || '';
                const bodyLines = lines.slice(1).join('\n');

                const parts = headerLine.split('|').map(p => p.trim());
                const wordName = parts[0] || 'Unknown Word';
                const wordPos = parts[1] || '';

                const card = document.createElement('div');
                card.className = 'word-card';

                const header = document.createElement('div');
                header.className = 'word-header';

                const title = document.createElement('span');
                title.className = 'word-title';
                title.textContent = wordName;
                header.appendChild(title);

                if (wordPos) {
                    const pos = document.createElement('span');
                    pos.className = 'word-pos';
                    pos.textContent = wordPos;
                    header.appendChild(pos);
                }

                card.appendChild(header);

                const definitionElement = parseMarkdown(bodyLines);
                card.appendChild(definitionElement);

                listWrapper.appendChild(card);
            });

            contentContainer.appendChild(listWrapper);
        }

        // Home Button Event Listener
        homeBtn.addEventListener('click', () => {
            if (activeLetterButton) {
                activeLetterButton.classList.remove('active');
                activeLetterButton = null;
            }
            renderWelcomeScreen();
        });

        // Initialize App on Load
        initAlphabetSidebar();
        renderWelcomeScreen();
    </script>
</body>
</html>
